services:
  # FastAPI backend service
  - type: web
    name: advisify-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && pip install bcrypt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User must specify this manually in Render dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # React Frontend static site hosting
  - type: web
    name: advisify-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    publishPath: "frontend/dist"
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: advisify-backend
          property: host

databases:
  - name: advisify-db
    plan: free
