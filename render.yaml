services:
  # FastAPI backend service
  - type: web
    name: advisify-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install bcrypt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # User must specify this manually in Render dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # React Frontend static site hosting
  - type: web
    name: advisify-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=31536000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # User must specify this manually after deploying backend

databases:
  - name: advisify-db
    plan: free
